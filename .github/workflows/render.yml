name: Render VAIЛЕРЫЧ pilot film
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip edge-tts
      - run: python scripts/generate_voice.py
      - run: npm install
      - run: npm run typecheck
      - run: npm run render
      - run: ffprobe -v error -show_entries format=duration -show_entries stream=codec_name,width,height,sample_rate -of json out/pilot01.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: vailerych-pilot-film
          path: out/pilot01.mp4
          if-no-files-found: error
